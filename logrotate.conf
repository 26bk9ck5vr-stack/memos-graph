# memos-graph 日志轮转配置
# ========================
# 安装：sudo cp /home/gato/memos-graph/logrotate.conf /etc/logrotate.d/memos-graph
# 测试：sudo logrotate -d /etc/logrotate.d/memos-graph
# 强制轮转：sudo logrotate -f /etc/logrotate.d/memos-graph

/home/gato/.memos-graph/logs/*.log {
    # 轮转频率
    daily
    
    # 保留最近 10 个文件
    rotate 10
    
    # 压缩旧日志
    compress
    delaycompress
    
    # 不报错如果日志文件不存在
    missingok
    
    # 空日志不轮转
    notifempty
    
    # 创建新文件的权限
    create 0640 gato gato
    
    # 按大小轮转 (50MB)
    size 50M
    
    # 日期扩展名
    dateext
    dateformat -%Y%m%d
    
    # 轮转后执行
    postrotate
        # 通知 systemd 重新加载日志 (如果使用 journal)
        # systemctl kill -s HUP memos-graph 2>/dev/null || true
        
        # 删除超过 30 天的旧日志 (额外保护)
        find /home/gato/.memos-graph/logs -name "*.log.gz" -mtime +30 -delete 2>/dev/null || true
    endscript
    
    # 轮转前执行
    prerotate
        # 确保日志目录存在
        mkdir -p /home/gato/.memos-graph/logs 2>/dev/null || true
    endscript
}

# 如果是通过 systemd journal 记录日志，使用以下配置：
# journalctl 日志由 systemd-journald 管理，见 /etc/systemd/journald.conf
