# memos-graph v3.0 配置文件 (已测试 SiliconFlow API)

database:
  url: postgresql+asyncpg://memos:memos@localhost:5432/memos_graph
  pool_size: 10
  pool_recycle: 3600

# Neo4j (可选，用于图谱存储)
neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: memos123

# LLM 配置 - SiliconFlow Qwen3-8B
llm:
  base_url: https://api.siliconflow.cn/v1
  api_key: sk-vsnwcxvhpnzsklcexqfxqaidfvugpdthmxufloibfktmkxbx
  model: Qwen/Qwen3-8B
  timeout_seconds: 30

# Embedding 配置 - SiliconFlow BAAI/bge-m3
embedding:
  provider: siliconflow
  base_url: https://api.siliconflow.cn/v1
  api_key: sk-vsnwcxvhpnzsklcexqfxqaidfvugpdthmxufloibfktmkxbx
  model: BAAI/bge-m3
  dimension: 1024
  timeout_seconds: 30

# Reranker 配置 - SiliconFlow BAAI/bge-reranker-v2-m3 (v3.1 使用)
reranker:
  provider: siliconflow
  base_url: https://api.siliconflow.cn/v1/rerank
  api_key: sk-vsnwcxvhpnzsklcexqfxqaidfvugpdthmxufloibfktmkxbx
  model: BAAI/bge-reranker-v2-m3
  timeout_seconds: 30
  enabled: false  # v3.1 才使用

# Hermes 集成 (可选)
hermes:
  state_db_path: ~/.hermes/state.db
  sync_interval_seconds: 60
  agent_id: hermes

# Viewer UI (可选)
viewer:
  enabled: true
  port: 8766
