# memos-graph 日志配置文件
# =========================
# 用法：在应用中加载此配置
#   python -c "import logging.config; logging.config.fileConfig('logging.conf')"

[loggers]
keys=root,memos_graph,memos_graph_api,memos_graph_db,memos_graph_vector

[handlers]
keys=consoleHandler,fileHandler,errorHandler,rotatingFileHandler

[formatters]
keys=simpleFormatter,detailedFormatter,jsonFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_memos_graph]
level=INFO
handlers=consoleHandler,fileHandler
qualname=memos_graph
propagate=0

[logger_memos_graph_api]
level=INFO
handlers=consoleHandler,fileHandler
qualname=memos_graph.api
propagate=0

[logger_memos_graph_db]
level=INFO
handlers=consoleHandler,fileHandler
qualname=memos_graph.db
propagate=0

[logger_memos_graph_vector]
level=INFO
handlers=consoleHandler,fileHandler
qualname=memos_graph.vector
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=detailedFormatter
args=('/var/log/memos-graph/memos-graph.log', 'a', 52428800, 10, 'utf-8')

[handler_errorHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=detailedFormatter
args=('/var/log/memos-graph/memos-graph-errors.log', 'a', 52428800, 10, 'utf-8')

[handler_rotatingFileHandler]
class=handlers.TimedRotatingFileHandler
level=DEBUG
formatter=detailedFormatter
args=('/var/log/memos-graph/memos-graph-daily.log', 'midnight', 1, 30, 'utf-8')

[formatter_simpleFormatter]
format=%(asctime)s [%(levelname)s] %(message)s
datefmt=%H:%M:%S

[formatter_detailedFormatter]
format=%(asctime)s [%(levelname)s] %(name)s - %(filename)s:%(lineno)d - %(funcName)s() - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_jsonFormatter]
format={"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "file": "%(filename)s", "line": %(lineno)d, "message": "%(message)s"}
datefmt=%Y-%m-%d %H:%M:%S
